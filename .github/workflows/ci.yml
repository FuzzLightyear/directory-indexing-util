# Quality gates: lint, format, types, tests, and a dependency audit.
# Single Ubuntu job with a cached uv environment to keep billed minutes low.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev --extra blake3

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --locked --all-extras --group docs --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit --disable-pip --no-deps -r requirements-audit.txt
